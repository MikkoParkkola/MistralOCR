name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff black bandit pip-audit
      - name: Lint
        run: |
          ruff .
          black --check .
      - name: Test
        run: |
          pytest -m "not integration" --cov=. --cov-report=term-missing
      - name: Security
        run: |
          bandit -r . || true
          pip-audit || true

