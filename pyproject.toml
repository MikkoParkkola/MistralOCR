[project]
name = "mistralocr"
version = "0.0.0"
description = "Tooling config for MistralOCR"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-fail-under=80"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff]
line-length = 88

[tool.bandit]
skips = ["B101"]

